<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#065f46" />
    <title>You are offline | Quran Tutor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f6faf7;
        color: #17211b;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 10% 0%, #d1fae9 0, transparent 28rem),
          #f6faf7;
      }

      main {
        width: min(100%, 32rem);
        padding: 2rem;
        box-sizing: border-box;
        border: 1px solid #a7f3d0;
        border-radius: 1.5rem;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 1rem 3rem rgb(6 78 59 / 10%);
        text-align: center;
      }

      img {
        width: 5rem;
        height: 5rem;
        border-radius: 1.25rem;
      }

      h1 {
        margin: 1.25rem 0 0;
        color: #064e3b;
        font-size: 1.6rem;
      }

      p {
        margin: 0.75rem 0 0;
        color: #4b5563;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: #047857;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Quran Tutor" />
      <h1>You are offline</h1>
      <p>
        You are offline. Please reconnect to join live classes, view private lessons,
        or manage your account.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
